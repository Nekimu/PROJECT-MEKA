# Personaje activo: carpeta de personas/ (dva, marin, yotsuba...). También con MEKA_PERSONA en .env
persona: "dva"

app:
  name: "Project MEKA"
  log_level: "INFO"          # DEBUG | INFO | WARNING | ERROR
  log_conversations: true    # Imprime la conversación en la consola

ai:
  model: "gemma3:12b"        # Debe ser multimodal para analizar imágenes
  base_url: "http://localhost:11434"
  temperature: 0.8
  keep_alive: 0              # 0 = descarga el modelo tras cada respuesta (ahorra RAM); "5m" = más rápido
  history_size: 20           # Mensajes recientes que recuerda por chat
  system_prompt_file: ""     # Opcional: .txt/.md para probar otra personalidad sin crear un paquete
  options:                   # Parámetros avanzados de generación de Ollama
    num_predict: 512
    top_k: 40
    top_p: 0.9
    repeat_penalty: 1.2
    repeat_last_n: 64
  vision_options:            # Análisis de imágenes: menor temperatura para precisión
    temperature: 0.6
    num_predict: 1024

stt:
  model_size: "base"         # tiny | base | small | medium | large | turbo
  language: "es"
  unload_after_use: true     # Libera Whisper de la RAM tras cada nota de voz

tts:
  enabled: true
  engine: "edge-tts"         # edge-tts | qwen-tts | piper
  fallback_engine: ""        # Motor de respaldo si el principal falla (vacío = sin respaldo)
  convert_to_ogg: true       # Convierte a OGG/Opus con FFmpeg para que llegue como nota de voz
  # Voz de edge-tts por defecto. Cada personaje la sustituye con `voice:` en su persona.yml
  voice: "es-MX-DaliaNeural"
  rate: "+0%"
  pitch: "+0Hz"
  # Qwen-TTS: clona una voz de referencia (requiere requirements-qwen.txt).
  # Usa SOLO tu propia voz o una con permiso, guardada en voices/ (ignorada por git).
  # No clones voces de actrices o actores de doblaje.
  qwen:
    model_id: "Qwen/Qwen3-TTS-12Hz-0.6B-Base"
    device: "cpu"            # Forzado a CPU para no competir con Ollama (GT 1030 2GB)
    ref_audio: ""            # p. ej. "voices/mi_voz.wav"
    ref_text: ""             # Transcripción exacta de ese audio
    language: "Spanish"
    unload_after_use: true   # Libera el modelo tras cada respuesta con audio
  # Piper (guardado por si acaso)
  piper:
    path: "C:/ProjectMEKA/piper/piper.exe"
    model_path: "C:/ProjectMEKA/piper/modelos/es_MX-claude-high.onnx"

documents:
  max_chars: 4000            # Caracteres del documento que se envían al modelo

media:
  # file_id de stickers que el personaje puede enviar con [STICKER]. Envíale un sticker al bot
  # y su file_id aparecerá en la consola.
  stickers: []
  # URLs o file_id de GIFs que puede enviar con [GIF]
  gifs: []

telegram:
  # El token y ALLOWED_USER_IDS se cargan desde .env por seguridad
  request_timeout: 30
  drop_pending_updates: false  # true = ignora los mensajes recibidos mientras el bot estaba apagado
