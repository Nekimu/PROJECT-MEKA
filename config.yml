# Personaje activo: carpeta de personas/ (dva, marin, yotsuba...). También con MEKA_PERSONA en .env
persona: "dva"

app:
  name: "Project MEKA"
  log_level: "INFO"          # DEBUG | INFO | WARNING | ERROR
  log_conversations: true    # Imprime la conversación en la consola

# MEKA Core: servidor local (REST + WebSocket) al que se conectan todos los canales
server:
  host: "127.0.0.1"          # Solo este equipo. Para la red local o Tailscale, "0.0.0.0" + token
  port: 8765
  url: ""                    # Cómo lo encuentran los canales; vacío = http://host:port (o MEKA_CORE_URL)
  # El token va en .env (MEKA_API_TOKEN). Es obligatorio si host no es 127.0.0.1/localhost
  allowed_origins: []        # Webs extra que pueden conectarse (la mascota y localhost ya lo tienen)
  max_upload_mb: 20          # Tamaño máximo de notas de voz, imágenes y documentos
  broadcast_messages: true   # La mascota también dice lo que MEKA responde por Telegram o MCP
  confirm_timeout_seconds: 120  # Espera máxima de un permiso (agent.confirm); sin respuesta = no
  audio_ttl_seconds: 300     # Tiempo que se guardan los audios generados hasta que un canal los pide

paths:
  memory_db: "data/meka.db"  # Recuerdos e historial en SQLite (ignorado por git)
  temp_dir: "temp"           # Audios y archivos temporales (ignorado por git)
  hands_dir: "data/hands"    # Puntos de restauración de las manos (git "sombra", ignorado por git)

memory:
  remember_pattern: 'recuerda\s+esto\s*:\s*(.+)'   # "Recuerda esto: ..." guarda un recuerdo
  recall_triggers: ["recuerdas", "te acuerdas", "sabes algo de", "que me dijiste de"]
  search_limit: 5            # Recuerdos que se añaden al contexto como máximo
  persist_history: true      # El historial de cada chat sobrevive a los reinicios
  semantic:                  # Recordar por significado (embeddings locales con Ollama)
    enabled: true            # Sin el modelo descargado, MEKA busca solo por palabras
    model: "embeddinggemma"  # ollama pull embeddinggemma (multilingüe, ~600 MB)
    keep_alive: 0            # Libera el modelo de embeddings tras usarlo
    min_similarity: 0.35     # Si preguntas "¿te acuerdas...?", recuerdos con al menos esta similitud
    auto_recall_similarity: 0.6  # Sin preguntar, solo recuerdos muy relacionados (0 = desactivado)
    # Prefijos recomendados por embeddinggemma; para nomic-embed-text: "search_query: " / "search_document: "
    query_prefix: "task: search result | query: "
    document_prefix: "title: none | text: "

ai:
  # Cerebro de cada tarea: ollama (local) | claude | gemini. La personalidad no cambia.
  provider: "ollama"         # Conversación
  vision_provider: ""        # Imágenes; vacío = el mismo que provider
  fallback_provider: ""      # Si el principal falla o se niega (p. ej. "ollama" como red local)
  local_only: false          # true = nada sale del equipo: se ignoran los proveedores en la nube
  history_size: 20           # Mensajes recientes que recuerda por chat

  routing:                   # Cerebro por tarea (vacío = provider). Ej.: chat en la nube, documentos en local
    chat: ""
    vision: ""               # Si está vacío se usa vision_provider
    document: ""

  privacy:                   # Lo privado NUNCA sale del equipo, ni siquiera como respaldo
    provider: "ollama"       # Cerebro local para lo privado; si no hay ninguno local, no se envía
    documents: true          # Los documentos se tratan como privados (análisis privado = local)
    detect_sensitive: true   # Contraseñas, llaves de API, tokens, tarjetas o CURP vuelven privada la conversación
    # Una conversación privada lo sigue siendo hasta reiniciarla (/v1/sessions/{id}/reset):
    # así su historial no viaja a la nube en el siguiente mensaje.

  providers:
    ollama:
      model: "gemma3:12b"    # Debe ser multimodal para analizar imágenes
      base_url: "http://localhost:11434"
      temperature: 0.8
      keep_alive: 0          # 0 = descarga el modelo tras cada respuesta (ahorra RAM); "5m" = más rápido
      options:               # Parámetros avanzados de generación de Ollama
        num_predict: 512
        top_k: 40
        top_p: 0.9
        repeat_penalty: 1.2
        repeat_last_n: 64
      vision_options:        # Análisis de imágenes: menor temperatura para precisión
        temperature: 0.6
        num_predict: 1024
    claude:                  # Requiere ANTHROPIC_API_KEY en .env y requirements-cloud.txt
      model: "claude-opus-5-5"
      effort: "low"          # low | medium | high | xhigh | max (más = piensa más y cuesta más)
      max_tokens: 16000
      fallbacks: true        # Si un filtro de seguridad la rechaza, la API reintenta con otro modelo
    gemini:                  # Requiere GEMINI_API_KEY en .env y requirements-cloud.txt
      model: "gemini-flash-latest"  # Alias de la última versión de Flash
      temperature: 0.8
      max_output_tokens: 2048

system:                      # Música y batería para la Dynamic Island (eventos system.*)
  enabled: true
  media: true                # Lo que suena en cualquier reproductor de Windows (API SMTC)
  battery: true
  media_interval: 2          # Segundos entre lecturas (solo se publica si algo cambia)
  battery_interval: 60
  notifications:             # Notificaciones de Windows en la isla (privadas: nunca a la nube ni al MCP)
    enabled: true
    apps: ["*"]              # Apps permitidas por nombre ("WhatsApp", "Outlook"...); "*" = todas
    blocked: []              # Apps que nunca se muestran
    hide_codes: true         # Oculta códigos de verificación (2FA, OTP, PIN)
    max_items: 20
    interval: 3              # Segundos entre lecturas

focus:                       # Modo concentración: retiene lo que distrae durante un bloque de trabajo
  default_minutes: 25
  max_minutes: 240
  allow_apps: []             # Notificaciones que pasan igual (p. ej. ["Teams"] para llamadas)
  battery_alert: 15          # La batería por debajo de este % (sin cargar) avisa igual

hands:                       # Las "manos" de MEKA (fase 3): leer carpetas que tú autorizas
  enabled: true
  folders: {}                # Fuera de estas carpetas, nada. Ejemplos:
  #  descargas: "~/Downloads"
  #  notas: {path: "~/Documents/Notas", private: true}   # private: el MCP (nube) no la ve
  # ⚠️ ESCRITURA POSPUESTA (T-042): no uses writable: true hasta resolver el aislamiento del
  #    sistema (usuario restringido de Windows o Docker). El código existe y está probado, pero
  #    por decisión del proyecto ninguna carpeta real admite cambios todavía.
  #  ordenar: {path: "~/Ordenar", writable: true}       # Admite cambios: cada uno pide permiso
  #                                                     # y deja un punto de restauración
  deny: []                   # Patrones extra que nunca se tocan (ya protegidos: .env, llaves, .git...)
  max_read_chars: 20000      # Caracteres máximos al leer un archivo
  max_results: 200           # Resultados máximos al listar o buscar
  max_scanned_files: 5000    # Archivos máximos que recorre una búsqueda
  max_write_chars: 200000    # Tamaño máximo de un archivo que MEKA escribe

stt:
  model_size: "base"         # tiny | base | small | medium | large | turbo
  language: "es"
  unload_after_use: true     # Libera Whisper de la RAM tras cada nota de voz

tts:
  enabled: true
  engine: "edge-tts"         # edge-tts | qwen-tts | piper
  fallback_engine: ""        # Motor de respaldo si el principal falla (vacío = sin respaldo)
  convert_to_ogg: true       # Convierte a OGG/Opus con FFmpeg para que llegue como nota de voz
  # Voz de edge-tts por defecto. Cada personaje la sustituye con `voice:` en su persona.yml
  voice: "es-MX-DaliaNeural"
  rate: "+0%"
  pitch: "+0Hz"
  # Qwen-TTS: clona una voz de referencia (requiere requirements-qwen.txt).
  # Usa SOLO tu propia voz o una con permiso, guardada en voices/ (ignorada por git).
  # No clones voces de actrices o actores de doblaje.
  qwen:
    model_id: "Qwen/Qwen3-TTS-12Hz-0.6B-Base"
    device: "cpu"            # Forzado a CPU para no competir con Ollama (GT 1030 2GB)
    ref_audio: ""            # p. ej. "voices/mi_voz.wav"
    ref_text: ""             # Transcripción exacta de ese audio
    language: "Spanish"
    unload_after_use: true   # Libera el modelo tras cada respuesta con audio
  # Piper: TTS local y ligero
  piper:
    path: "piper"            # Ejecutable (en el PATH o ruta completa)
    model_path: "models/piper/es_MX-claude-high.onnx"

documents:
  max_chars: 4000            # Caracteres del documento que se envían al modelo

# ------------------------------------------------------------------ canales
# Cada canal es un cliente de MEKA Core: no carga modelos y puede ir en otro equipo.

telegram:
  enabled: true              # El token y ALLOWED_USER_IDS se cargan desde .env por seguridad
  request_timeout: 30
  drop_pending_updates: false  # true = ignora los mensajes recibidos mientras el bot estaba apagado
  typing_delay: 1.0          # Pausas de "escribiendo..." para parecer humana (0 = sin pausas)
  # file_id de stickers que el personaje puede enviar con [STICKER]. Envíale un sticker al bot
  # y su file_id aparecerá en la consola.
  stickers: []
  gifs: []                   # URLs o file_id de GIFs que puede enviar con [GIF]

mcp:
  # Servidor MCP para Claude Desktop, Claude Code, Gemini CLI... (python run.py mcp)
  session: "mcp"             # Conversación propia, separada de Telegram
  user: ""                   # Memoria que usa; vacío = el primer ID de ALLOWED_USER_IDS
