# Personaje activo: carpeta de personas/ (dva, marin, yotsuba...). También con MEKA_PERSONA en .env
persona: "dva"

app:
  name: "Project MEKA"
  log_level: "INFO"          # DEBUG | INFO | WARNING | ERROR
  log_conversations: true    # Imprime la conversación en la consola

# MEKA Core: servidor local (REST + WebSocket) al que se conectan todos los canales
server:
  host: "127.0.0.1"          # Solo este equipo. Para la red local o Tailscale, "0.0.0.0" + token
  port: 8765
  url: ""                    # Cómo lo encuentran los canales; vacío = http://host:port (o MEKA_CORE_URL)
  # El token va en .env (MEKA_API_TOKEN). Es obligatorio si host no es 127.0.0.1/localhost
  allowed_origins: []        # Webs extra que pueden conectarse (la mascota y localhost ya lo tienen)
  max_upload_mb: 20          # Tamaño máximo de notas de voz, imágenes y documentos
  broadcast_messages: true   # La mascota también dice lo que MEKA responde por Telegram o MCP
  audio_ttl_seconds: 300     # Tiempo que se guardan los audios generados hasta que un canal los pide

paths:
  memory_file: "memory.json" # Recuerdos persistentes (ignorado por git)
  temp_dir: "temp"           # Audios y archivos temporales (ignorado por git)

memory:
  remember_pattern: 'recuerda\s+esto\s*:\s*(.+)'   # "Recuerda esto: ..." guarda un recuerdo
  recall_triggers: ["recuerdas", "te acuerdas", "sabes algo de", "que me dijiste de"]
  search_limit: 5            # Recuerdos que se añaden al contexto como máximo

ai:
  model: "gemma3:12b"        # Debe ser multimodal para analizar imágenes
  base_url: "http://localhost:11434"
  temperature: 0.8
  keep_alive: 0              # 0 = descarga el modelo tras cada respuesta (ahorra RAM); "5m" = más rápido
  history_size: 20           # Mensajes recientes que recuerda por chat
  options:                   # Parámetros avanzados de generación de Ollama
    num_predict: 512
    top_k: 40
    top_p: 0.9
    repeat_penalty: 1.2
    repeat_last_n: 64
  vision_options:            # Análisis de imágenes: menor temperatura para precisión
    temperature: 0.6
    num_predict: 1024

stt:
  model_size: "base"         # tiny | base | small | medium | large | turbo
  language: "es"
  unload_after_use: true     # Libera Whisper de la RAM tras cada nota de voz

tts:
  enabled: true
  engine: "edge-tts"         # edge-tts | qwen-tts | piper
  fallback_engine: ""        # Motor de respaldo si el principal falla (vacío = sin respaldo)
  convert_to_ogg: true       # Convierte a OGG/Opus con FFmpeg para que llegue como nota de voz
  # Voz de edge-tts por defecto. Cada personaje la sustituye con `voice:` en su persona.yml
  voice: "es-MX-DaliaNeural"
  rate: "+0%"
  pitch: "+0Hz"
  # Qwen-TTS: clona una voz de referencia (requiere requirements-qwen.txt).
  # Usa SOLO tu propia voz o una con permiso, guardada en voices/ (ignorada por git).
  # No clones voces de actrices o actores de doblaje.
  qwen:
    model_id: "Qwen/Qwen3-TTS-12Hz-0.6B-Base"
    device: "cpu"            # Forzado a CPU para no competir con Ollama (GT 1030 2GB)
    ref_audio: ""            # p. ej. "voices/mi_voz.wav"
    ref_text: ""             # Transcripción exacta de ese audio
    language: "Spanish"
    unload_after_use: true   # Libera el modelo tras cada respuesta con audio
  # Piper: TTS local y ligero
  piper:
    path: "piper"            # Ejecutable (en el PATH o ruta completa)
    model_path: "models/piper/es_MX-claude-high.onnx"

documents:
  max_chars: 4000            # Caracteres del documento que se envían al modelo

# ------------------------------------------------------------------ canales
# Cada canal es un cliente de MEKA Core: no carga modelos y puede ir en otro equipo.

telegram:
  enabled: true              # El token y ALLOWED_USER_IDS se cargan desde .env por seguridad
  request_timeout: 30
  drop_pending_updates: false  # true = ignora los mensajes recibidos mientras el bot estaba apagado
  typing_delay: 1.0          # Pausas de "escribiendo..." para parecer humana (0 = sin pausas)
  # file_id de stickers que el personaje puede enviar con [STICKER]. Envíale un sticker al bot
  # y su file_id aparecerá en la consola.
  stickers: []
  gifs: []                   # URLs o file_id de GIFs que puede enviar con [GIF]

mcp:
  # Servidor MCP para Claude Desktop, Claude Code, Gemini CLI... (python run.py mcp)
  session: "mcp"             # Conversación propia, separada de Telegram
  user: ""                   # Memoria que usa; vacío = el primer ID de ALLOWED_USER_IDS
